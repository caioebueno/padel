; Per-platform rendering budgets (docs/decisions/0009-lighting-and-venue.md).
;
; Target: 60 fps at 1080p on an M2 Pro class Mac (GDD 1, GDD 12.5), on Metal with no
; hardware ray tracing. These are starting values: profile the look-dev level from the
; Broadcast camera with `stat unit` and `stat gpu` (docs/decisions/0009 has the steps) and
; tune here, never in code. Windows keeps the engine's Epic defaults for now.

[Mac DeviceProfile]
DeviceType=Mac
BaseProfileName=
; TSR renders about 810p and upsamples to 1080p; the static broadcast camera keeps it clean.
+CVars=r.ScreenPercentage=75
; Software Lumen: M2 has no hardware ray tracing, and the mesh distance fields are enough
; for a court, a hall and four players.
+CVars=r.Lumen.HardwareRayTracing=0
; High (not Epic) global illumination, reflections and shadows.
+CVars=sg.GlobalIlluminationQuality=2
+CVars=sg.ReflectionQuality=2
+CVars=sg.ShadowQuality=2
+CVars=sg.PostProcessQuality=3
; Half-resolution Lumen reflections, except the glass's front layer, which stays on.
+CVars=r.Lumen.Reflections.DownsampleFactor=2
+CVars=r.Lumen.TranslucencyReflections.FrontLayer.Enable=1
; Fewer shadow rays for the two shadowed floodlights (soft shadows stay soft).
+CVars=r.Shadow.Virtual.SMRT.RayCountLocal=4
; A coarser volumetric fog grid: the haze is low-frequency anyway.
+CVars=r.VolumetricFog.GridPixelSize=16
+CVars=r.VolumetricFog.GridSizeZ=64
